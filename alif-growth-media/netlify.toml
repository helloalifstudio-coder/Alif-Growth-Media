# Netlify deploy config for this TanStack Start (Vite + Nitro) app.
#
# This is a server-rendered app, NOT a static site. When NETLIFY=true is set
# (Netlify sets it automatically), Nitro builds with its Netlify preset:
#   static assets  -> dist/
#   SSR handler    -> .netlify/functions-internal/server/
#   routing        -> dist/_redirects (catch-all to the server function)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify deploy previews are paused by owner request (2026-11-06).
# Review this branch on Vercel; do not re-enable without explicit approval.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"
