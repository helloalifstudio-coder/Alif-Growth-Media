# Netlify deploy config for this TanStack Start (Vite + Nitro) app.
#
# This is a server-rendered app, NOT a static site. When NETLIFY=true is set
# (Netlify sets it automatically), Nitro builds with its Netlify preset:
#   static assets  -> dist/
#   SSR handler    -> .netlify/v1/functions (Nitro Netlify Frameworks API)
#   deploy config  -> .netlify/v1/config.json

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify deploy previews are paused by owner request (2026-11-06).
# Review this branch on Vercel; do not re-enable without explicit approval.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

# Only merge commits bearing [netlify-release] build on the production branch.
# The first release is explicit; ordinary main commits do not trigger builds.
[context.production]
  ignore = "node ./scripts/netlify-release-gate.cjs"
