# One-time cleanup of branches whose PRs #1-#6 are verified merged.
# THIS WORKFLOW MUST BE REMOVED immediately after its run completes.
name: One-time merged branch cleanup

on:
  push:
    branches:
      - design/immersive-agency-experience

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Delete only the six previously merged topic branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            brand/github-agency-portfolio-20261101 \
            ci/quality-baseline-20261102 \
            security/dependabot-maintenance-20261102 \
            security/codeql-js-ts-20261103 \
            seo/sitemap-public-routes-20261104 \
            accessibility/mobile-menu-escape-20261105; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
              echo "Deleted merged branch: $branch"
            else
              echo "Already absent: $branch"
            fi
          done
