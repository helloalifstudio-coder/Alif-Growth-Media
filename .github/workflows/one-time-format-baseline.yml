# One-time source formatting helper for PR #2. DELETE THIS WORKFLOW
# from the branch after the formatting commit is produced and checked.
name: One-time baseline formatting

on:
  push:
    branches:
      - ci/quality-baseline-20261102

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ci/quality-baseline-20261102
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: alif-growth-media/package-lock.json
      - name: Install and format existing TypeScript source
        working-directory: alif-growth-media
        run: |
          npm ci
          npx prettier --write "src/**/*.{ts,tsx}" "vite.config.ts"
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit reviewed formatting only to the existing PR branch
        run: |
          git add -u alif-growth-media/src alif-growth-media/vite.config.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: apply repository Prettier baseline"
            git push origin HEAD:ci/quality-baseline-20261102
          fi
