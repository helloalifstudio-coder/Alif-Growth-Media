# Temporary workflow to generate a properly resolved npm lockfile for a security patch.
# Delete after the verified commit; never merge this workflow to main.
name: One-time TanStack security patch

on:
  push:
    branches: [design/immersive-agency-experience]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: alif-growth-media
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: design/immersive-agency-experience
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: alif-growth-media/package-lock.json
      - name: Patch vulnerable TanStack Start and resolve lockfile
        run: |
          npm ci
          npm install --save-exact @tanstack/react-start@1.168.60
          node - <<'NODE'
          const lock = require("./package-lock.json");
          const version = (name) => lock.packages["node_modules/" + name]?.version;
          const start = version("@tanstack/react-start");
          const core = version("@tanstack/start-server-core");
          if (start !== "1.168.60") throw new Error("Unexpected React Start version: " + start);
          if (!core) throw new Error("Missing start-server-core");
          const [major, minor, patch] = core.split(".").map(Number);
          if (major !== 1 || minor < 169 || (minor === 169 && patch < 39))
            throw new Error("Vulnerable @tanstack/start-server-core: " + core);
          console.log("Verified patched dependency versions: react-start", start, "start-server-core", core);
          NODE
      - name: Verify reproducible install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit updated npm manifest and lockfile to existing design branch only
        working-directory: .
        run: |
          git add alif-growth-media/package.json alif-growth-media/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(security): patch TanStack Start XSS with resolved lockfile [skip netlify]"
            git push origin HEAD:design/immersive-agency-experience
          fi
