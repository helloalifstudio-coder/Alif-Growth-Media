# One-time design branch formatter. Remove after the autoformat commit.
name: Design branch formatting

on:
  push:
    branches: [design/immersive-agency-experience]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: design/immersive-agency-experience
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: alif-growth-media/package-lock.json
      - name: Format and validate changed website files
        working-directory: alif-growth-media
        run: |
          npm ci
          npx prettier --write src/components/site/InteractiveAgencyHero.tsx src/routes/index.tsx
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit formatting to the same branch
        run: |
          git add -u alif-growth-media/src/components/site/InteractiveAgencyHero.tsx alif-growth-media/src/routes/index.tsx
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(design): format interactive agency experience"
            git push origin HEAD:design/immersive-agency-experience
          fi
