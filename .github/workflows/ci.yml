# Run the website's existing quality checks without production credentials.
# App lives in alif-growth-media/, not the repository root.
name: Website quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: alif-growth-media
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: alif-growth-media/package-lock.json
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Test controlled Netlify release policy
        run: node --test scripts/netlify-release-gate.test.cjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Production build (no deployment)
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Verify Nitro Netlify server output (no deployment)
        if: ${{ always() && steps.install.outcome == 'success' }}
        env:
          NETLIFY: "true"
          NITRO_PRESET: "netlify"
        run: |
          npm run build
          test -d dist
          test -d .netlify/v1/functions
          test -f .netlify/v1/config.json
